spring.application.name=gateway_service

server.port=9000
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.instance.prefer-ip-address=true

# Route 1: Verification Service
spring.cloud.gateway.routes[0].id=verification-service
spring.cloud.gateway.routes[0].uri=lb://verification-service
spring.cloud.gateway.routes[0].predicates[0]=Path=/api/v1.0/verify/**

# Route 2: Auth Service
spring.cloud.gateway.routes[1].id=auth-service
spring.cloud.gateway.routes[1].uri=lb://auth-service
spring.cloud.gateway.routes[1].predicates[0]=Path=/api/v1.0/**

# Route 3: Credential Service
spring.cloud.gateway.routes[2].id=credential-service
spring.cloud.gateway.routes[2].uri=lb://credential-service
spring.cloud.gateway.routes[2].predicates[0]=Path=/api/certificates/**

# Gateway Global CORS Configuration
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowed-origin-patterns=*
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowed-methods=GET, POST, PUT, PATCH, DELETE, OPTIONS
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowed-headers=*
spring.cloud.gateway.globalcors.cors-configurations.[/**].allow-credentials=false

# Deduplicate CORS response headers from downstream microservices
spring.cloud.gateway.default-filters[0]=DedupeResponseHeader=Access-Control-Allow-Origin Access-Control-Allow-Credentials, RETAIN_FIRST

# Actuator — expose health endpoint for system health monitoring
management.endpoints.web.exposure.include=health,info
management.endpoint.health.enabled=true
